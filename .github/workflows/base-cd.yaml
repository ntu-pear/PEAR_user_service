name: Base CD

on:
  workflow_call:
    inputs:
      environment: { required: true, type: string }
      runner-label: { required: true, type: string }
      kube-deployment-file: { required: true, type: string }
      app-name: { required: true, type: string }
      dockerfile: { required: true, type: string }
      kube-filebeat-file: {required: true, type: string}
      docker-image-name: { required: true, type: string }
      docker-image-tag: { required: true, type: string }
    secrets:
      DB_SERVER_DEV: { required: true }
      DB_DATABASE_DEV: { required: true }
      DB_DATABASE_PORT: { required: true }
      DB_USERNAME_DEV: { required: true }
      DB_PASSWORD_DEV: { required: true }
      DB_DRIVER_DEV: { required: true }
      WEB_FE_ORIGIN: { required: true }
      WEB_FE_ORIGIN_STAGING: { required: true }
      REFRESH_SECRET_KEY: { required: true }
      MAIL_USERNAME: { required: true }
      MAIL_FROM: { required: true }
      MAIL_PORT: { required: true }
      MAIL_SERVER: { required: true }
      MAIL_STARTTLS: { required: true }
      MAIL_SSL_TLS: { required: true }
      MAIL_FROM_NAME: { required: true }
      USE_CREDENTIALS: { required: true }
      VALIDATE_CERTS: { required: true }
      SALT: { required: true }
      SECRET_KEY: { required: true }
      OTP_EMAIL: { required: true }
      ACCESS_TOKEN_EXPIRE_MINUTES: { required: true }
      REFRESH_TOKEN_EXPIRE_MINUTES: { required: true }
      SESSION_EXPIRE_MINUTES: { required: true }
      EMAIL_LINK_BASEURL: { required: true }
      SENDPULSE_API_KEY: { required: true }
      SENDPULSE_SECRET_KEY: { required: true }
      CLOUDINARY_CLOUD_NAME: { required: true }
      CLOUDINARY_API_KEY: { required: true }
      CLOUDINARY_API_SECRET: { required: true }
      MAIL_PASSWORD: { required: true }
      RABBITMQ_HOST: { required: true }
      RABBITMQ_PORT: { required: true }
      RABBITMQ_USER: { required: true }
      RABBITMQ_PASS: { required: true }
      RABBITMQ_VIRTUAL_HOST: { required: true }

jobs:
  deploy:
    runs-on: ${{ fromJSON(inputs['runner-label']) }}
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Set commit SHA
        run: |
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Create .env from GitHub Secrets
        run: |
          echo "SERVICE_NAME=${{ vars.SERVICE_NAME }}" >> .env
          echo "DB_SERVER_DEV=${{ secrets.DB_SERVER_DEV }}" >> .env
          echo "DB_DATABASE_DEV=${{ secrets.DB_DATABASE_DEV }}" >> .env
          echo "DB_DATABASE_PORT=${{ secrets.DB_DATABASE_PORT }}" >> .env
          echo "DB_USERNAME_DEV=${{ secrets.DB_USERNAME_DEV }}" >> .env
          echo "DB_PASSWORD_DEV=${{ secrets.DB_PASSWORD_DEV }}" >> .env
          echo "DB_DRIVER_DEV=${{ secrets.DB_DRIVER_DEV }}" >> .env
          echo "WEB_FE_ORIGIN=${{ secrets.WEB_FE_ORIGIN }}" >> .env
          echo "WEB_FE_ORIGIN_STAGING=${{ secrets.WEB_FE_ORIGIN_STAGING }}" >> .env
          echo "REFRESH_SECRET_KEY=${{ secrets.REFRESH_SECRET_KEY }}" >> .env
          echo "MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}" >> .env
          echo "MAIL_FROM=${{ secrets.MAIL_FROM }}" >> .env
          echo "MAIL_PORT=${{ secrets.MAIL_PORT }}" >> .env
          echo "MAIL_SERVER=${{ secrets.MAIL_SERVER }}" >> .env
          echo "MAIL_STARTTLS=${{ secrets.MAIL_STARTTLS }}" >> .env
          echo "MAIL_SSL_TLS=${{ secrets.MAIL_SSL_TLS }}" >> .env
          echo "MAIL_FROM_NAME=${{ secrets.MAIL_FROM_NAME }}" >> .env
          echo "USE_CREDENTIALS=${{ secrets.USE_CREDENTIALS }}" >> .env
          echo "VALIDATE_CERTS=${{ secrets.VALIDATE_CERTS }}" >> .env
          echo "SALT=${{ secrets.SALT }}" >> .env
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
          echo "OTP_EMAIL=${{ secrets.OTP_EMAIL }}" >> .env
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}" >> .env
          echo "REFRESH_TOKEN_EXPIRE_MINUTES=${{ secrets.REFRESH_TOKEN_EXPIRE_MINUTES }}" >> .env
          echo "SESSION_EXPIRE_MINUTES=${{ secrets.SESSION_EXPIRE_MINUTES }}" >> .env
          echo "EMAIL_LINK_BASEURL=${{ secrets.EMAIL_LINK_BASEURL }}" >> .env
          echo "SENDPULSE_API_KEY=${{ secrets.SENDPULSE_API_KEY }}" >> .env
          echo "SENDPULSE_SECRET_KEY=${{ secrets.SENDPULSE_SECRET_KEY }}" >> .env
          echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> .env
          echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}" >> .env
          echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}" >> .env
          echo "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" >> .env
          echo "RABBITMQ_HOST=${{ secrets.RABBITMQ_HOST }}" >> .env
          echo "RABBITMQ_PORT=${{ secrets.RABBITMQ_PORT }}" >> .env
          echo "RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}" >> .env
          echo "RABBITMQ_PASS=${{ secrets.RABBITMQ_PASS }}" >> .env
          echo "RABBITMQ_VIRTUAL_HOST=${{ secrets.RABBITMQ_VIRTUAL_HOST }}" >> .env

      - name: Build Docker image
        run: |
          docker build --no-cache -f ${{ inputs.dockerfile }} -t ${{ inputs.docker-image-name }}:${{ env.COMMIT_SHA }} .

      - name: Tag Docker image
        run: |
          docker tag ${{ inputs.docker-image-name }}:${{ env.COMMIT_SHA }} \
                     localhost:5000/${{ inputs.docker-image-name }}:${{ env.COMMIT_SHA }}

      - name: Push Docker image to local registry
        run: |
          docker push localhost:5000/${{ inputs.docker-image-name }}:${{ env.COMMIT_SHA }}

      - name: Load image into minikube node
        run: |
          minikube image load ${{ inputs.docker-image-name }}:${{ env.COMMIT_SHA }}
          minikube image load ${{ inputs.docker-image-name }}:${{ inputs.docker-image-tag }}

      - name: Deploy filebeat to kubernetes
        run: |
          kubectl apply -f '${{ inputs.kube-filebeat-file }}'

      - name: Ensure deployment exists
        run: |
          kubectl get deployment ${{ inputs.app-name }} || kubectl apply -f '${{ inputs.kube-deployment-file }}'

      - name: Deploy to Kubernetes (rolling update)
        run: |
          kubectl set image deployment/${{ inputs.app-name }} \
            user-service=host.minikube.internal:5000/${{ inputs.docker-image-name }}:${{ env.COMMIT_SHA }}
          kubectl rollout status deployment/${{ inputs.app-name }} --timeout=300s

      - name: Docker maintenance cleanup
        run: |
          docker container prune -f
          docker image prune -f
          minikube ssh -- "docker container prune -f && docker image prune -a -f"
