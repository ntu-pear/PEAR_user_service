apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service-dev
  labels:
    app: user-service-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service-dev
  template:
    metadata:
      labels:
        app: user-service-dev
    spec:
      containers:
        - name: user-service
          image: host.minikube.internal:5000/user_service_dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: user-service-dev
spec:
  selector:
    app: user-service-dev
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30000
  type: NodePort