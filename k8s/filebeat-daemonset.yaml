apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: kube-system
data:
  filebeat.yml: |-
    filebeat.inputs:
      - type: filestream
        enabled: true
        paths:
          - /home/VMadmin/FYP_microservices/PEAR_user_service/logs/*.log
        ignore_older: 24h
        json.keys_under_root: true    # Parse JSON fields at root level
        json.add_error_key: true      # Add error key if parsing fails

    logging.level: warning

    output.logstash:
      hosts: ["192.168.188.184:5044"]
